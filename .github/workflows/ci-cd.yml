name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flask-cicd
  CONTAINER_NAME: flask-cicd
  CONTAINER_PORT: 5000

jobs:

  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -v

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com                  # Added: Must match your IAM Trust Policy aud claim
          aws-sts-regional-endpoints: regional         # Added: Eliminates intermittent OIDC token rejection loops

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image information
        id: image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "Image URI: ${IMAGE_URI}"

      - name: Build Docker image
        run: |
          docker build -t "${{ steps.image.outputs.image_uri }}" .

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.image.outputs.image_uri }}"

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy SHA-tagged image to EC2
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            ec2-user@${{ secrets.EC2_HOST }} \
            "IMAGE_TAG='${IMAGE_TAG}' IMAGE_URI='${IMAGE_URI}' bash -s" << 'REMOTE_SCRIPT'

          set -e

          echo "Logging in to Amazon ECR..."
          aws ecr get-login-password --region us-east-1 | \
            docker login \
            --username AWS \
            --password-stdin \
            545931885961.dkr.ecr.us-east-1.amazonaws.com

          echo "Pulling image..."
          docker pull ${IMAGE_URI}

          echo "Stopping old container if it exists..."
          docker stop flask-cicd 2>/dev/null || true

          echo "Removing old container if it exists..."
          docker rm flask-cicd 2>/dev/null || true

          echo "Starting new container..."
          docker run -d \
            --name flask-cicd \
            -p 5000:5000 \
            ${IMAGE_URI}

          echo "Waiting for application to start..."
          sleep 10

          echo "Checking application health..."
          curl --fail --silent http://localhost:5000/health

          echo
          echo "Deployment successful!"

          REMOTE_SCRIPT
